# Sætter en ny adgangskode for en bruger (kun for administratorer med adgang til dette repo).
# Kør: GitHub → Actions → "Sæt adgangskode for bruger" → "Run workflow" → udfyld e-mail og ny adgangskode.
# Bemærk: workflow-inputs kan ses af dem, der har adgang til repoets Actions-historik.
# Adgangskoden maskeres i loggen. Bed brugeren om at skifte den efter første login.
name: Sæt adgangskode for bruger

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Brugerens e-mail"
        required: true
        type: string
      password:
        description: "Ny adgangskode (mindst 6 tegn)"
        required: true
        type: string

jobs:
  set-password:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tjek nøgle
        if: env.HAS_KEY != 'true'
        run: echo "::error::Secret FIREBASE_SERVICE_ACCOUNT mangler." && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skriv servicekonto-nøgle og maskér adgangskoden
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          echo "::add-mask::$NEW_PASSWORD"
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEW_PASSWORD: ${{ inputs.password }}

      - name: Installér Firebase Admin SDK
        run: npm install --no-save --no-audit --no-fund firebase-admin@13

      - name: Sæt adgangskoden
        run: node tools/set-password.mjs "$USER_EMAIL" "$NEW_PASSWORD"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          USER_EMAIL: ${{ inputs.email }}
          NEW_PASSWORD: ${{ inputs.password }}

      - name: Fjern nøgle
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
